[pytest]
# Tell pytest where the tests live, and where to find our own modules
# (pages/ and config.py sit next to this file, not inside an installed package).
testpaths = tests
pythonpath = .

# chromium is the default browser for class. Add --headed to watch it run.
# --alluredir writes the raw Allure files. --clean-alluredir starts a fresh report.
addopts = -v --browser chromium --alluredir=allure-results --clean-alluredir

# Every run writes logs/tests.log (pytest creates the folder, and replaces the file).
# INFO by default: page opens, clicks, test results.
# Add --log-file-level=DEBUG to also see each locator Playwright uses.
# [%(test)s] is the running test's name. conftest.py fills it in.
log_file = logs/tests.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-5s [%(test)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# @smoke in a feature file becomes pytest.mark.smoke.
# Register the name here so pytest does not warn that the mark is unknown.
markers =
    smoke: scenarios that check the main pages
