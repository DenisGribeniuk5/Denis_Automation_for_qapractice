[pytest]
# pages/, data/, and config.py are imported from the project root.
testpaths = tests
pythonpath = .

# Chromium by default. Add --headed to watch the run.
addopts = -v --browser chromium --alluredir=allure-results --clean-alluredir

# INFO: page opens, clicks, results. --log-file-level=DEBUG adds locators and typed values.
# %(test)s is the running test's name, set in conftest.py.
log_file = logs/tests.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-5s [%(test)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: scenarios that check the main pages
