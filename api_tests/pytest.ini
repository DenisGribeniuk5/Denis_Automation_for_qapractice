[pytest]
# api/, models/, helper/, and config.py are imported from the project root.
testpaths = tests
pythonpath = .

addopts = -v -n auto --alluredir=allure-results --clean-alluredir

# INFO: method, URL, status. --log-file-level=DEBUG adds request and response bodies.
log_file = logs/tests.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-5s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: fast checks that the API is up and the main flow works
